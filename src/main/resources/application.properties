spring.config.import=optional:file:.env[.properties]

spring.application.name=cineone-admin
server.port=8080

# CẤU HÌNH DATABASE MYSQL
spring.datasource.url=jdbc:mysql://localhost:3306/cineone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.thymeleaf.cache=false

# TMDB API
tmdb.access-token=${TMDB_ACCESS_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.language=vi-VN
tmdb.connect-timeout=3s
tmdb.request-timeout=10s

# GEMINI AI
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.request-timeout=15s

ai.search.time.approximate-minutes=30
ai.search.time.morning-start=06:00
ai.search.time.morning-end=12:00
ai.search.time.afternoon-start=12:00
ai.search.time.afternoon-end=18:00
ai.search.time.evening-start=18:00
ai.search.time.evening-end=00:00
ai.search.time.late-night-start=00:00
ai.search.time.late-night-end=06:00

# MOCK DATA
cineone.mock.source-root=${CINEONE_MOCK_SOURCE_ROOT:classpath:mock/data_source/}

# CẤU HÌNH JWT
jwt.secret=${JWT_SECRET:change-me-local}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# CẤU HÌNH GỬI MAIL SMTP
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000