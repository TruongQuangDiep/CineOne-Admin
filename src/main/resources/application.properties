spring.application.name=cineone-admin

server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/cineone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# TMDB API
tmdb.access-token=${TMDB_ACCESS_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.language=vi-VN
tmdb.connect-timeout=3s
tmdb.request-timeout=10s

# Gemini AI
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL}
gemini.request-timeout=15s

# AI Search Configuration
ai.search.time.approximate-minutes=30
ai.search.time.morning-start=06:00
ai.search.time.morning-end=12:00
ai.search.time.afternoon-start=12:00
ai.search.time.afternoon-end=18:00
ai.search.time.evening-start=18:00
ai.search.time.evening-end=00:00
ai.search.time.late-night-start=00:00
ai.search.time.late-night-end=06:00

# Mock adapter
cineone.mock.source-root=${CINEONE_MOCK_SOURCE_ROOT:classpath:mock/data_source/}

# JWT Configuration (Đọc từ .env)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS}

# payOS Configuration (Đọc từ .env)
payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.return-url=http://localhost:8080/payment/success
payos.cancel-url=http://localhost:8080/payment/cancel