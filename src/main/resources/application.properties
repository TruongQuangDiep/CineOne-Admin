spring.application.name=cineone-admin

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/cineone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

# TMDB API Read Access Token; never commit a real token.
tmdb.access-token=${TMDB_ACCESS_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.language=vi-VN
tmdb.connect-timeout=3s
tmdb.request-timeout=10s

# Mock adapter: bundled snapshot; override with file:/D:/Learning/Project/data_source/
cineone.mock.source-root=${CINEONE_MOCK_SOURCE_ROOT:classpath:mock/data_source/}
