<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: main-layout(~{::#catalog-content}, 'showtimes', 'Tra cứu suất chiếu')}">
<body><div id="catalog-content">
    <div th:replace="~{catalog/fragments :: heading('QUẢN LÝ SUẤT CHIẾU')}"></div>
    <form th:action="@{/showtimes}" method="get" class="card border-0 shadow-sm p-3 mb-4 catalog-filters catalog-showtime-filters">
        <div><label for="cinema" class="form-label">Tên rạp</label><input id="cinema" name="cinema" th:value="${cinema}" maxlength="255" class="form-control" placeholder="Tìm rạp..."></div>
        <div><label for="movie" class="form-label">Tên phim</label><input id="movie" name="movie" th:value="${movie}" maxlength="255" class="form-control" placeholder="Tìm tên phim..."></div>
        <div><label for="date" class="form-label">Ngày</label><input id="date" name="date" type="date" th:value="${date}" class="form-control"></div>
        <div><label for="status" class="form-label">Trạng thái</label><select id="status" name="status" class="form-select"><option value="">Tất cả</option><option th:each="s : ${ {'OPEN','CLOSED','CANCELLED','ENDED'} }" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option></select></div>
        <div class="d-flex gap-2 align-items-end"><button class="btn btn-primary">Lọc</button><a th:href="@{/showtimes}" class="btn btn-outline-secondary">Đặt lại</a></div>
    </form>
    <div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
        <thead class="table-light"><tr><th>Poster</th><th>Phim</th><th>Rạp</th><th>Phòng</th><th>Bắt đầu</th><th>Kết thúc</th><th>Giá cơ bản</th><th>Trạng thái</th></tr></thead>
        <tbody><tr th:each="s : ${items.content}">
            <td><span th:replace="~{catalog/fragments :: image(${s.movie.posterUrl}, ${s.movie.title})}"></span></td>
            <td><a th:href="@{/movies/{id}(id=${s.movie.movieId})}" th:text="${s.movie.title}"></a></td>
            <td><a th:href="@{/cinemas/{id}(id=${s.room.cinema.cinemaId})}" th:text="${s.room.cinema.name}"></a></td>
            <td><a th:href="@{/cinemas/{cid}/rooms/{rid}(cid=${s.room.cinema.cinemaId},rid=${s.room.roomId})}" th:text="${s.room.name}"></a></td>
            <td class="text-nowrap" th:text="${#temporals.format(s.startTime, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="text-nowrap" th:text="${#temporals.format(s.endTime, 'dd/MM/yyyy HH:mm')}"></td>
            <td class="text-nowrap" th:text="${#numbers.formatDecimal(s.basePrice, 1, 'POINT', 0, 'COMMA') + ' ₫'}"></td>
            <td><span th:replace="~{catalog/fragments :: status(${s.status})}"></span></td>
        </tr><tr th:if="${items.empty}"><td colspan="8" class="text-center text-secondary py-5">Không tìm thấy suất chiếu phù hợp.</td></tr></tbody>
    </table></div><div th:replace="~{catalog/fragments :: pagination(${items}, @{/showtimes(cinema=${cinema},movie=${movie},date=${date},status=${status})})}"></div></div>
</div></body></html>
