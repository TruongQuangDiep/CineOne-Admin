<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="top-header">
    <div class="header-left">
        <h5 class="m-0 fw-bold text-secondary">Hệ Thống Quản Trị CineOne</h5>
    </div>
    
    <div class="header-user">
        <div class="position-relative me-3">
            <i class="bi bi-bell fs-5 text-secondary"></i>
        </div>
        
        <div class="user-badge dropdown">
            <!-- Nút bấm mở Dropdown hiển thị Email đang đăng nhập -->
            <button class="btn btn-light btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-5 text-primary"></i>
                <span sec:authentication="name">admin@cineone.vn</span>
            </button>
            
            <!-- Menu Dropdown -->
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li>
                    <!-- Form gửi POST tới /logout có CSRF token tự động của Thymeleaf -->
                    <form th:action="@{/logout}" method="post" class="m-0 p-0">
                        <button type="submit" class="dropdown-item text-danger d-flex align-items-center">
                            <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
