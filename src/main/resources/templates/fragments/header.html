<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="top-header">
    <div class="header-left">
        <h5 class="m-0 fw-bold text-secondary">Hệ Thống Quản Trị CineOne</h5>
    </div>
    <div class="header-user">
        <div class="position-relative me-3">
            <i class="bi bi-bell fs-5 text-secondary"></i>
        </div>
        <div class="user-badge dropdown">
            <button class="btn btn-light btn-sm dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-person-circle fs-5 text-primary"></i>
                <span>Admin</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><a class="dropdown-item" th:href="@{/auth/login}"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</a></li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
