<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::#membership-content}, 'users', 'Hạng thành viên')}">
<body>
<div id="membership-content">
    <nav aria-label="breadcrumb" class="page-breadcrumb">
        <ol class="breadcrumb mb-2">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/users}">Người dùng</a></li>
            <li class="breadcrumb-item active" aria-current="page">Hạng thành viên</li>
        </ol>
    </nav>

    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <h3 class="m-0 fw-bold">CẤU HÌNH HẠNG THÀNH VIÊN</h3>
        <div class="d-flex gap-2">
            <a th:href="@{/users}" class="btn btn-outline-secondary">Danh sách người dùng</a>
            <a th:href="@{/memberships/new}" class="btn btn-primary">+ Thêm hạng thành viên</a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm border-0 mb-4" role="status">
        <span th:text="${success}">Thao tác thành công.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 80px;">ID</th>
                    <th>Tên hạng</th>
                    <th>Mức chi tiêu tối thiểu</th>
                    <th>Mô tả / Quyền lợi</th>
                    <th>Trạng thái</th>
                    <th style="width: 140px;" class="text-end pe-3">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tiers}">
                    <td class="font-monospace text-secondary" th:text="${t.membershipTierId}">1</td>
                    <td>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle fs-6" th:text="${t.name}">VIP</span>
                    </td>
                    <td class="fw-bold text-dark font-monospace"
                        th:text="${#numbers.formatDecimal(t.minSpending, 0, 'POINT', 0, 'POINT') + ' đ'}">10.000.000 đ</td>
                    <td class="text-secondary small" th:text="${t.description != null ? t.description : 'Chưa có mô tả'}">Mô tả quyền lợi</td>
                    <td>
                        <span class="badge" th:classappend="${t.status == 'ACTIVE' ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-secondary-subtle text-secondary border border-secondary-subtle'}">
                            <span class="status-indicator-dot" th:classappend="${t.status == 'ACTIVE' ? 'active' : 'inactive'}"></span>
                            <span th:text="${t.status == 'ACTIVE' ? 'Đang áp dụng' : 'Tạm ngưng'}">ACTIVE</span>
                        </span>
                    </td>
                    <td class="text-end pe-3">
                        <div class="d-flex justify-content-end gap-2">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/memberships/{id}/edit(id=${t.membershipTierId})}">Sửa</a>
                            <form th:action="@{/memberships/{id}/status(id=${t.membershipTierId})}" method="post"
                                  data-confirm="Thay đổi trạng thái áp dụng của hạng thành viên này?">
                                <input type="hidden" name="enabled" th:value="${t.status != 'ACTIVE'}">
                                <button class="btn btn-sm" th:classappend="${t.status == 'ACTIVE' ? 'btn-outline-danger' : 'btn-outline-success'}"
                                        type="submit" th:text="${t.status == 'ACTIVE' ? 'Khóa' : 'Kích hoạt'}">Khóa</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tiers)}">
                    <td colspan="6" class="text-center text-muted py-5">Chưa có hạng thành viên nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
