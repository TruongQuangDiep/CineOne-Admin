<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Quản Trị - CineOne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }
        body {
            background: radial-gradient(circle at 85% 15%, rgba(16, 185, 129, 0.12), transparent 35%),
                        radial-gradient(circle at 15% 85%, rgba(14, 165, 233, 0.08), transparent 40%),
                        #0b1120;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }
        .login-card {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 420px;
            padding: 2.75rem 2.25rem;
        }
        .brand-logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }
        .badge-admin {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            padding: 0.2rem 0.55rem;
            border-radius: 9999px;
            vertical-align: middle;
            margin-left: 0.4rem;
        }
        .form-label {
            font-size: 0.84rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.45rem;
        }
        .input-group-text {
            background-color: #111827;
            border: 1px solid #334155;
            border-right: none;
            color: #64748b;
            padding-left: 1rem;
            padding-right: 0.75rem;
            border-top-left-radius: 0.75rem !important;
            border-bottom-left-radius: 0.75rem !important;
        }
        .form-control {
            background-color: #111827;
            border: 1px solid #334155;
            border-left: none;
            color: #f8fafc;
            padding: 0.75rem 1rem 0.75rem 0.25rem;
            font-size: 0.92rem;
            border-top-right-radius: 0.75rem !important;
            border-bottom-right-radius: 0.75rem !important;
            transition: all 0.2s ease;
        }
        .form-control:focus {
            background-color: #111827;
            color: #ffffff;
            box-shadow: none;
        }
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #10b981;
        }
        .input-group:focus-within {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
            border-radius: 0.75rem;
        }
        .btn-submit {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            padding: 0.85rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 0.75rem;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
            transition: all 0.25s ease;
            margin-top: 0.5rem;
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #059669, #047857);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.45);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .alert {
            border-radius: 0.75rem;
            border: none;
            font-size: 0.86rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <!-- Logo app CineOne -->
            <img th:src="@{/images/logoC1.jpg}" alt="CineOne Logo" class="brand-logo mb-3">
            <h3 class="fw-bold text-white mb-1">
                Đăng nhập 
            </h3>
            <p class="text-secondary small">Cổng thông tin quản trị & điều phối rạp chiếu phim</p>
        </div>

        <!-- Thông báo lỗi khi đăng nhập thất bại -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <!-- Thông báo đăng xuất thành công -->
        <div th:if="${logoutMessage}" class="alert alert-success py-2 small d-flex align-items-center mb-3" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${logoutMessage}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" placeholder="admin@cineone.vn" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-submit w-100">
                Đăng nhập hệ thống
            </button>
        </form>

        <div class="text-center mt-4 pt-2">
            <small class="text-muted" style="font-size: 0.76rem;">© 2026 CineOne Platform. Bảo mật hệ thống.</small>
        </div>
    </div>
</body>
</html>
