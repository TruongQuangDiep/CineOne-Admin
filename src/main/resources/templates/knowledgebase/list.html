<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::#kb-content}, 'knowledgebase', 'Quản lý Trợ giúp & Chính sách')}">
<body>
<div id="kb-content">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <h3 class="m-0 fw-bold">
            <i class="bi bi-journal-text me-2"></i>QUẢN LÝ TRỢ GIÚP &amp; CHÍNH SÁCH
        </h3>
        <a class="btn btn-outline-dark px-3" th:href="@{/knowledgebase/create}">
            + Thêm nội dung
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div class="card border shadow-sm p-3 mb-4">
        <form th:action="@{/knowledgebase}" method="get" class="row g-3 align-items-end" id="kb-filter">
            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input id="filter-keyword" type="text" name="keyword" class="form-control border-start-0"
                           placeholder="Tìm kiếm tiêu đề..." th:value="${keyword}">
                </div>
            </div>
            <div class="col-md-3">
                <label for="filter-category" class="form-label small text-muted mb-1">Loại</label>
                <select id="filter-category" name="category" class="form-select" onchange="this.form.submit()">
                    <option value="">Tất cả</option>
                    <option value="FAQ" th:selected="${category == 'FAQ'}">FAQ</option>
                    <option value="GUIDE" th:selected="${category == 'GUIDE' or category == 'HƯỚNG DẪN'}">GUIDE</option>
                    <option value="POLICY" th:selected="${category == 'POLICY' or category == 'CHÍNH SÁCH'}">POLICY</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="filter-status" class="form-label small text-muted mb-1">Trạng thái</label>
                <div class="d-flex gap-2">
                    <select id="filter-status" name="status" class="form-select" onchange="this.form.submit()">
                        <option value="">Tất cả</option>
                        <option value="ACTIVE" th:selected="${status == 'ACTIVE'}">ACTIVE</option>
                        <option value="INACTIVE" th:selected="${status == 'INACTIVE'}">INACTIVE</option>
                    </select>
                    <button class="btn btn-outline-secondary" type="submit" title="Tìm kiếm"><i class="bi bi-search"></i></button>
                </div>
            </div>
        </form>
    </div>

    <div class="card border shadow-sm">
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Tiêu đề</th>
                    <th style="width: 140px;">Loại</th>
                    <th style="width: 160px;">Cập nhật</th>
                    <th style="width: 150px;">Trạng thái</th>
                    <th class="text-center" style="width: 50px;"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${entries.content}">
                    <td th:text="${item.title}"></td>
                    <td th:text="${item.category == 'HƯỚNG DẪN' or item.category == 'GUIDE' ? 'GUIDE' : (item.category == 'CHÍNH SÁCH' or item.category == 'POLICY' ? 'POLICY' : (item.category == 'SUPPORT' ? 'SUPPORT' : 'FAQ'))}"></td>
                    <td th:text="${item.updatedAt != null ? #temporals.format(item.updatedAt, 'dd/MM/yyyy') : (item.createdAt != null ? #temporals.format(item.createdAt, 'dd/MM/yyyy') : '—')}"></td>
                    <td th:text="${item.status}"></td>
                    <td class="text-center">
                        <div class="dropdown">
                            <button class="btn btn-sm btn-light border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end table-action-menu shadow-sm">
                                <li>
                                    <a class="dropdown-item" th:href="@{/knowledgebase/{id}(id=${item.knowledgeId})}">Xem chi tiết</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" th:href="@{/knowledgebase/{id}/edit(id=${item.knowledgeId})}">Chỉnh sửa</a>
                                </li>
                                <li>
                                    <form th:action="@{/knowledgebase/{id}/toggle-status(id=${item.knowledgeId})}" method="post">
                                        <button type="submit" class="dropdown-item"
                                                th:text="${item.status == 'ACTIVE' ? 'Vô hiệu hóa' : 'Kích hoạt'}"></button>
                                    </form>
                                </li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/knowledgebase/{id}/delete(id=${item.knowledgeId})}" method="post"
                                          onsubmit="return confirm('Bạn có chắc chắn muốn xóa nội dung này không?');">
                                        <button type="submit" class="dropdown-item text-danger">Xóa</button>
                                    </form>
                                </li>
                            </ul>
                        </div>
                    </td>
                </tr>
                <tr th:if="${entries.empty}">
                    <td colspan="5" class="text-center text-muted py-5">
                        Chưa có nội dung trợ giúp &amp; chính sách nào phù hợp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center p-3 flex-wrap gap-2 border-top">
            <nav aria-label="Phân trang">
                <ul class="pagination pagination-sm mb-0" th:if="${entries.totalPages > 0}">
                    <li class="page-item" th:classappend="${entries.first ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/knowledgebase(keyword=${keyword},category=${category},status=${status},page=${entries.number - 1})}">&lt;--</a>
                    </li>
                    <li class="page-item"
                        th:each="p : ${#numbers.sequence(0, entries.totalPages - 1)}"
                        th:classappend="${p == entries.number ? 'active' : ''}">
                        <a class="page-link"
                           th:href="@{/knowledgebase(keyword=${keyword},category=${category},status=${status},page=${p})}"
                           th:text="${p + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${entries.last ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/knowledgebase(keyword=${keyword},category=${category},status=${status},page=${entries.number + 1})}">--&gt;</a>
                    </li>
                </ul>
            </nav>
            <small class="text-muted"
                   th:text="|Hiển thị ${entries.empty ? 0 : (entries.number * entries.size + 1)} - ${entries.empty ? 0 : (entries.number * entries.size + entries.numberOfElements)} / ${entries.totalElements} nội dung|">
                Hiển thị 0 - 0 / 0 nội dung
            </small>
        </div>
    </div>
</div>
</body>
</html>
