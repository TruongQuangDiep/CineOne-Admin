<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::#kb-form-content}, 'knowledgebase', ${isEdit ? 'Chỉnh sửa nội dung' : 'Thêm nội dung trợ giúp & chính sách'})}">
<body>
<div id="kb-form-content">
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mx-auto" style="max-width: 800px;" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div class="card border shadow-sm p-4 mx-auto" style="max-width: 800px;">
        <div class="mb-4">
            <a th:href="@{/knowledgebase}" class="text-decoration-none text-dark d-inline-flex align-items-center gap-2 fs-5 fw-bold">
                <i class="bi bi-arrow-left"></i>
                <span th:text="${readOnly != null and readOnly ? 'CHI TIẾT NỘI DUNG TRỢ GIÚP &amp; CHÍNH SÁCH' : (isEdit ? 'CHỈNH SỬA NỘI DUNG TRỢ GIÚP &amp; CHÍNH SÁCH' : 'THÊM NỘI DUNG TRỢ GIÚP &amp; CHÍNH SÁCH')}"></span>
            </a>
        </div>

        <form th:action="${isEdit} ? @{/knowledgebase/{id}/edit(id=${id})} : @{/knowledgebase/create}"
              th:object="${entry}" method="post">

            <div class="mb-3">
                <label for="kb-title" class="form-label">Tiêu đề</label>
                <input type="text" id="kb-title" class="form-control" th:field="*{title}"
                       th:readonly="${readOnly != null and readOnly}"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>

            <div class="d-flex align-items-center gap-3 mb-3">
                <label for="kb-category" class="mb-0">Loại</label>
                <select id="kb-category" class="form-select" style="max-width: 200px;" th:field="*{category}"
                        th:disabled="${readOnly != null and readOnly}"
                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                    <option value="FAQ">FAQ</option>
                    <option value="GUIDE">GUIDE</option>
                    <option value="POLICY">POLICY</option>
                </select>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>

            <div class="mb-3">
                <label for="kb-content" class="form-label">Nội dung</label>
                <textarea id="kb-content" rows="8" class="form-control" th:field="*{content}"
                          th:readonly="${readOnly != null and readOnly}"
                          th:classappend="${#fields.hasErrors('content')} ? 'is-invalid' : ''"></textarea>
                <div class="invalid-feedback" th:errors="*{content}"></div>
            </div>

            <div class="d-flex align-items-center gap-3 mb-4">
                <label for="kb-status" class="mb-0">Trạng thái</label>
                <select id="kb-status" class="form-select" style="max-width: 200px;" th:field="*{status}"
                        th:disabled="${readOnly != null and readOnly}">
                    <option value="ACTIVE">ACTIVE</option>
                    <option value="INACTIVE">INACTIVE</option>
                </select>
            </div>

            <div class="d-flex justify-content-center gap-3">
                <a class="btn btn-outline-dark px-5" th:href="@{/knowledgebase}">Hủy</a>
                <button th:if="${readOnly == null or !readOnly}" type="submit" class="btn btn-outline-dark px-5">
                    Lưu nội dung
                </button>
                <a th:if="${readOnly != null and readOnly}" class="btn btn-outline-dark px-5"
                   th:href="@{/knowledgebase/{id}/edit(id=${id})}">
                    Chỉnh sửa
                </a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
