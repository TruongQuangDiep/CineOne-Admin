<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::#kb-form-content}, 'knowledgebase', ${isEdit ? 'Chỉnh sửa bài viết' : 'Thêm bài viết mới'})}">
<body>
<div id="kb-form-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
        <h3 class="m-0 fw-bold" th:text="${isEdit ? 'CHỈNH SỬA BÀI VIẾT KIẾN THỨC' : 'THÊM MỚI BÀI VIẾT KIẾN THỨC'}"></h3>
        <a class="btn btn-outline-secondary" th:href="@{/knowledgebase}">
            <i class="bi bi-arrow-left me-1"></i>Quay lại danh sách
        </a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div class="card border-0 shadow-sm p-4">
        <form th:action="${isEdit} ? @{/knowledgebase/{id}/edit(id=${id})} : @{/knowledgebase/create}"
              th:object="${entry}" method="post">

            <div class="mb-3">
                <label for="kb-title" class="form-label fw-semibold">Tiêu đề bài viết / Câu hỏi <span class="text-danger">*</span></label>
                <input type="text" id="kb-title" class="form-control" th:field="*{title}"
                       placeholder="Ví dụ: Làm thế nào để đặt vé xem phim trên CineOne?"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''">
                <div class="invalid-feedback" th:errors="*{title}"></div>
            </div>

            <div class="row mb-3 g-3">
                <div class="col-md-6">
                    <label for="kb-category" class="form-label fw-semibold">Danh mục <span class="text-danger">*</span></label>
                    <select id="kb-category" class="form-select" th:field="*{category}"
                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid' : ''">
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{category}"></div>
                </div>
                <div class="col-md-6">
                    <label for="kb-status" class="form-label fw-semibold">Trạng thái hiển thị</label>
                    <select id="kb-status" class="form-select" th:field="*{status}">
                        <option value="ACTIVE">Hoạt động (Hiển thị cho Chatbot & Người dùng)</option>
                        <option value="INACTIVE">Tạm khóa (Ẩn khỏi hệ thống)</option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label for="kb-content" class="form-label fw-semibold">Nội dung giải đáp / Chi tiết chính sách <span class="text-danger">*</span></label>
                <textarea id="kb-content" rows="10" class="form-control" th:field="*{content}"
                          placeholder="Nhập nội dung chi tiết quy trình, chính sách hoặc câu trả lời đầy đủ..."
                          th:classappend="${#fields.hasErrors('content')} ? 'is-invalid' : ''"></textarea>
                <div class="invalid-feedback" th:errors="*{content}"></div>
                <small class="text-muted">Nội dung này sẽ được công cụ AI RAG bóc tách để trả lời tự động cho khách hàng.</small>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a class="btn btn-light px-4" th:href="@{/knowledgebase}">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-save me-1"></i><span th:text="${isEdit ? 'Lưu cập nhật' : 'Tạo bài viết'}"></span>
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
