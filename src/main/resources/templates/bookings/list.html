<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Đơn đặt vé | CINEONE ADMIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="admin-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></div>

    <div class="main-wrapper">
        <div th:replace="~{fragments/header :: header}"></div>

        <main class="content-area">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1">QUẢN LÝ ĐƠN ĐẶT VÉ </h3>
                    <p class="text-muted mb-0">Tra cứu, đối soát và theo dõi trạng thái đơn đặt vé</p>
                </div>
            </div>

            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <form th:action="@{/bookings}" method="get" class="row g-3">
                        <div class="col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                                <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                                       placeholder="Tìm theo Mã đơn vé...">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select name="status" class="form-select">
                                <option value="">-- Tất cả trạng thái --</option>
                                <option th:each="st : ${statuses}" 
                                        th:value="${st.name()}" 
                                        th:text="${st}" 
                                        th:selected="${(status != null and status.toString() == st.name()) or (param.status != null and param.status[0] == st.name())}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary flex-grow-1"><i class="bi bi-filter"></i> Lọc</button>
                            <a th:href="@{/bookings}" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-3">Mã đơn</th>
                                    <th>Khách hàng</th>
                                    <th>Phim & Rạp</th>
                                    <th>Suất chiếu</th>
                                    <th>Tổng tiền</th>
                                    <th>Trạng thái</th>
                                    <th>Ngày tạo</th>
                                    <th class="text-end pe-3">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${bookingsPage.empty}">
                                    <td colspan="8" class="text-center py-4 text-muted">Không tìm thấy đơn đặt vé nào.</td>
                                </tr>
                                <tr th:each="b : ${bookingsPage.content}">
                                    <td class="ps-3 fw-bold text-primary" th:text="${b.bookingCode}">BK-12345</td>
                                    <td>
                                        <div class="fw-semibold" th:text="${b.customerName != null ? b.customerName : 'Khách vãng lai'}">Nguyễn Văn A</div>
                                        <small class="text-muted" th:text="${b.customerPhone}"></small>
                                    </td>
                                    <td>
                                        <div class="fw-semibold text-truncate" style="max-width: 200px;" th:text="${b.movieTitle}">Tên Phim</div>
                                        <small class="text-muted" th:text="${b.cinemaName} + ' - ' + ${b.roomName}"></small>
                                    </td>
                                    <td>
                                        <span th:text="${#temporals.format(b.showtimeStart, 'dd/MM/yyyy HH:mm')}"></span>
                                    </td>
                                    <td class="fw-bold text-success"
                                        th:text="${#numbers.formatDecimal(b.totalAmount, 0, 'POINT', 0, 'COMMA')} + ' đ'"></td>
                                    <td>
                                        <span th:class="'badge ' + 
                                            (${b.status.name() == 'CONFIRMED' or b.status.name() == 'PAID'} ? 'bg-success' : 
                                            (${b.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 
                                            (${b.status.name() == 'CANCELLED' or b.status.name() == 'EXPIRED'} ? 'bg-danger' : 'bg-secondary')))"
                                            th:text="${b.status}">PENDING</span>
                                    </td>
                                    <td>
                                        <small class="text-muted" th:text="${#temporals.format(b.createdAt, 'dd/MM/yyyy HH:mm')}"></small>
                                    </td>
                                    <td class="text-end pe-3">
                                        <a th:href="@{'/bookings/' + ${b.bookingId}}" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-eye"></i> Chi tiết
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${bookingsPage.totalPages > 1}">
                    <div class="text-muted small">
                        Trang <span th:text="${bookingsPage.number + 1}"></span> / <span th:text="${bookingsPage.totalPages}"></span>
                        (Tổng cộng <span th:text="${bookingsPage.totalElements}"></span> đơn)
                    </div>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${bookingsPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/bookings(page=${bookingsPage.number - 1}, keyword=${keyword}, status=${status})}">Trước</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, bookingsPage.totalPages - 1)}"
                            th:classappend="${i == bookingsPage.number} ? 'active'">
                            <a class="page-link" th:href="@{/bookings(page=${i}, keyword=${keyword}, status=${status})}" th:text="${i + 1}"></a>
                        </li>
                        <li class="page-item" th:classappend="${bookingsPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/bookings(page=${bookingsPage.number + 1}, keyword=${keyword}, status=${status})}">Sau</a>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
