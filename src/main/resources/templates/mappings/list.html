<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::#mapping-content}, 'mappings', 'Mapping')}">
<body>
<div id="mapping-content">
    <div class="d-flex align-items-center gap-2 mb-4">
        <h3 class="m-0 fw-bold">MAPPING ĐỊNH DANH (ÁNH XẠ ID)</h3>
    </div>

    <!-- Bộ lọc tìm kiếm Mapping -->
    <form th:action="@{/mappings}" method="get" class="card border-0 shadow-sm p-3 mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <label for="providerId" class="form-label small fw-semibold text-secondary">Nhà cung cấp</label>
                <select id="providerId" name="providerId" class="form-select">
                    <option value="">Tất cả nhà cung cấp</option>
                    <option th:each="p : ${providers}" th:value="${p.providerId}" th:selected="${providerId == p.providerId}"
                            th:text="${p.name + (p.status == 'INACTIVE' ? ' (đã ngừng)' : '')}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="entity" class="form-label small fw-semibold text-secondary">Loại thực thể (Entity)</label>
                <select id="entity" name="entity" class="form-select">
                    <option value="">Tất cả thực thể</option>
                    <option th:each="e : ${entities}" th:value="${e}" th:text="${e}" th:selected="${entity == e}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="status" class="form-label small fw-semibold text-secondary">Trạng thái ánh xạ</label>
                <select id="status" name="status" class="form-select">
                    <option value="">Tất cả trạng thái</option>
                    <option th:each="s : ${ {'ACTIVE','INACTIVE','ERROR'} }" th:value="${s}" th:text="${s}" th:selected="${status == s}"></option>
                </select>
            </div>
            <div class="col-md-8">
                <label for="mapping-search" class="visually-hidden">Tìm Internal / External ID</label>
                <input id="mapping-search" class="form-control" name="q" th:value="${q}" maxlength="255"
                       placeholder="Tìm kiếm theo mã Internal ID hoặc External ID...">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button class="btn btn-primary flex-grow-1" type="submit">Lọc dữ liệu</button>
                <a class="btn btn-outline-secondary" th:href="@{/mappings}">Đặt lại</a>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input id="includeStopped" name="includeStopped" value="true" type="checkbox" class="form-check-input" th:checked="${includeStopped}">
                    <label for="includeStopped" class="form-check-label text-secondary small">
                        Hiển thị cả mapping của nhà cung cấp đã tạm ngừng đồng bộ
                    </label>
                </div>
            </div>
        </div>
    </form>

    <!-- Bảng danh sách Mapping -->
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Tên nhà cung cấp</th>
                    <th>Entity</th>
                    <th>Internal ID</th>
                    <th>External ID</th>
                    <th>Đồng bộ cuối</th>
                    <th>Trạng thái</th>
                    <th style="width: 80px;" class="text-end pe-3">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${mappings.content}">
                    <td>
                        <span class="fw-semibold text-dark" th:text="${m.providerName}">Provider Name</span>
                        <small th:if="${m.providerStatus == 'INACTIVE'}" class="d-block text-danger small">
                            Đã ngừng đồng bộ
                        </small>
                    </td>
                    <td>
                        <span class="badge bg-primary-subtle text-primary border border-primary-subtle font-monospace"
                              th:text="${m.entityType}">CINEMA</span>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark border font-monospace fs-6" th:text="${m.internalId}">101</span>
                    </td>
                    <td class="text-break" style="max-width:280px">
                        <code class="text-dark bg-light px-2 py-1 rounded border font-monospace" th:text="${m.externalId}">CGV-8891</code>
                    </td>
                    <td class="text-nowrap small text-secondary">
                        <span th:text="${m.lastSyncedAt == null ? 'Chưa đồng bộ' : #temporals.format(m.lastSyncedAt, 'dd/MM/yyyy HH:mm')}">Chưa đồng bộ</span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${m.status == 'ACTIVE' ? 'bg-success-subtle text-success border border-success-subtle' : (m.status == 'ERROR' ? 'bg-danger-subtle text-danger border border-danger-subtle' : 'bg-secondary-subtle text-secondary border border-secondary-subtle')}">
                            <span class="status-indicator-dot"
                                  th:classappend="${m.status == 'ACTIVE' ? 'active' : (m.status == 'ERROR' ? 'error' : 'inactive')}"></span>
                            <span th:text="${m.status}">ACTIVE</span>
                        </span>
                    </td>
                    <td class="text-end pe-3">
                        <div class="dropdown dropend">
                            <button class="btn btn-sm btn-light border" type="button" data-bs-toggle="dropdown" data-table-actions aria-expanded="false" th:aria-label="${'Thao tác mapping ' + m.mappingId}">
                                <i class="bi bi-three-dots-vertical"></i>
                            </button>
                            <ul class="dropdown-menu table-action-menu dropdown-menu-end shadow-sm">
                                <li><a class="dropdown-item" th:href="@{/mappings/{id}(id=${m.mappingId})}">Xem chi tiết</a></li>
                                <li><a class="dropdown-item" th:href="@{/providers/{id}(id=${m.providerId})}">Xem nhà cung cấp</a></li>
                            </ul>
                        </div>
                    </td>
                </tr>
                <tr th:if="${mappings.empty}">
                    <td colspan="7" class="text-center text-muted py-5">
                        Không tìm thấy mapping phù hợp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Phân trang Mapping -->
    <nav class="d-flex align-items-center justify-content-between mt-3 flex-wrap gap-2" aria-label="Phân trang mapping">
        <span class="small text-muted" th:text="${'Tổng ' + mappings.totalElements + ' mapping'}">Tổng 0 mapping</span>
        <div class="d-flex align-items-center gap-3">
            <a th:if="${mappings.hasPrevious()}" class="btn btn-sm btn-outline-secondary"
               th:href="@{/mappings(providerId=${providerId},entity=${entity},status=${status},q=${q},includeStopped=${includeStopped},page=${mappings.number - 1})}">Trước</a>
            <span class="small text-secondary" th:text="${'Trang ' + (mappings.number + 1) + ' / ' + (mappings.totalPages == 0 ? 1 : mappings.totalPages)}">Trang 1 / 1</span>
            <a th:if="${mappings.hasNext()}" class="btn btn-sm btn-outline-secondary"
               th:href="@{/mappings(providerId=${providerId},entity=${entity},status=${status},q=${q},includeStopped=${includeStopped},page=${mappings.number + 1})}">Sau</a>
        </div>
    </nav>
</div>
</body>
</html>
