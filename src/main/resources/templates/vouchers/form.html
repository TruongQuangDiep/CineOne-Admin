<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit ? 'Chỉnh sửa Voucher' : 'Tạo Voucher mới'} + ' | CINEONE ADMIN'">Form Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></div>

    <div class="main-content flex-grow-1 p-4" style="margin-left: 260px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/vouchers}" class="btn btn-sm btn-outline-secondary mb-2"><i class="bi bi-arrow-left"></i> Quay lại</a>
                <h3 class="fw-bold mb-0" th:text="${isEdit ? 'Chỉnh sửa Voucher' : 'Thêm Voucher mới'}">Thêm Voucher</h3>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm" style="max-width: 800px;">
            <div class="card-body p-4">
                <form th:action="${isEdit ? '/vouchers/edit/' + voucherId : '/vouchers/create'}"
                      th:object="${voucherRequest}" method="post">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mã Voucher <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{code}" class="form-control text-uppercase font-monospace"
                                   placeholder="VD: CINE50" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Loại giảm giá <span class="text-danger">*</span></label>
                            <select th:field="*{discountType}" class="form-select">
                                <option value="PERCENT">Phần trăm (%)</option>
                                <option value="FIXED">Số tiền cố định (VNĐ)</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Giá trị giảm <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{discountValue}" class="form-control" placeholder="VD: 20 hoặc 50000" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Giảm tối đa (VNĐ)</label>
                            <input type="number" th:field="*{maxDiscount}" class="form-control" placeholder="Áp dụng khi chọn loại %">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Đơn hàng tối thiểu (VNĐ)</label>
                            <input type="number" th:field="*{minOrder}" class="form-control" placeholder="Mặc định: 0">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Giới hạn số lượt dùng</label>
                            <input type="number" th:field="*{usageLimit}" class="form-control" placeholder="Để trống nếu không giới hạn">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Mô tả chương trình</label>
                            <textarea th:field="*{description}" rows="2" class="form-control" placeholder="Mô tả chi tiết khuyến mãi..."></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Thời gian bắt đầu</label>
                            <input type="datetime-local" th:field="*{startAt}" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Thời gian kết thúc</label>
                            <input type="datetime-local" th:field="*{endAt}" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Trạng thái</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="ACTIVE">Hoạt động (ACTIVE)</option>
                                <option value="INACTIVE">Tạm dừng (INACTIVE)</option>
                            </select>
                        </div>

                        <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                            <a th:href="@{/vouchers}" class="btn btn-outline-secondary">Hủy</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i> <span th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo Voucher'}">Lưu</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
