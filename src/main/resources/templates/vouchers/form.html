<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit ? 'Chỉnh sửa Voucher' : 'Tạo Voucher mới'} + ' | CINEONE ADMIN'">Form Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></div>

    <div class="main-content flex-grow-1 p-4" style="margin-left: 260px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/vouchers}" class="btn btn-sm btn-outline-secondary mb-2"><i class="bi bi-arrow-left"></i> Quay lại</a>
                <h3 class="fw-bold mb-0" th:text="${isEdit ? 'Chỉnh sửa Voucher' : 'Thêm Voucher mới'}">Thêm Voucher</h3>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${errorMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm" style="max-width: 800px;">
            <div class="card-body p-4">
                <form th:action="${isEdit ? '/vouchers/edit/' + voucherId : '/vouchers/create'}"
                      th:object="${voucherRequest}" method="post" enctype="multipart/form-data">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mã Voucher <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{code}" class="form-control text-uppercase font-monospace"
                                   placeholder="VD: CINE50" required>
                            <div class="text-danger small" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Loại giảm giá <span class="text-danger">*</span></label>
                            <select th:field="*{discountType}" class="form-select">
                                <option value="PERCENT">Phần trăm (%)</option>
                                <option value="FIXED">Số tiền cố định (VNĐ)</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Giá trị giảm <span class="text-danger">*</span></label>
                            <input type="number" th:field="*{discountValue}" class="form-control" placeholder="VD: 20 hoặc 50000" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Giảm tối đa (VNĐ)</label>
                            <input type="number" th:field="*{maxDiscount}" class="form-control" placeholder="Áp dụng khi chọn loại %">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Đơn hàng tối thiểu (VNĐ)</label>
                            <input type="number" th:field="*{minOrder}" class="form-control" placeholder="Mặc định: 0">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Giới hạn số lượt dùng</label>
                            <input type="number" th:field="*{usageLimit}" class="form-control" placeholder="Để trống nếu không giới hạn">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Mô tả chương trình</label>
                            <textarea th:field="*{description}" rows="2" class="form-control" placeholder="Mô tả chi tiết khuyến mãi..."></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Hình ảnh Banner Voucher (Hiển thị popup & khuyến mãi trên App)</label>
                            <input type="file" name="imageFile" id="imageFileInput" class="form-control" accept="image/*" onchange="previewVoucherImage(this)">
                            <input type="hidden" th:field="*{imageUrl}">
                            
                            <!-- Vùng xem trước hình ảnh -->
                            <div id="imagePreviewContainer" class="mt-2" th:style="*{imageUrl != null and !imageUrl.empty} ? 'display:block' : 'display:none'">
                                <img id="imagePreview" th:src="*{imageUrl}" alt="Voucher Preview" 
                                    class="rounded border shadow-sm" style="max-height: 180px; max-width: 100%; object-fit: cover;">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Thời gian bắt đầu</label>
                            <input type="datetime-local" th:field="*{startAt}" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Thời gian kết thúc</label>
                            <input type="datetime-local" th:field="*{endAt}" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Trạng thái</label>
                            <select th:field="*{status}" class="form-select">
                                <option value="ACTIVE">Hoạt động (ACTIVE)</option>
                                <option value="INACTIVE">Tạm dừng (INACTIVE)</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold d-block">Áp dụng cho Hạng thành viên <span class="text-danger">*</span></label>
                            <div class="d-flex flex-wrap gap-4 pt-1 align-items-center">
                                <!-- 1. Tùy chọn TẤT CẢ (Mặc định) -->
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="tier_all" checked>
                                    <label class="form-check-label fw-semibold" for="tier_all">
                                        <span class="badge bg-dark text-white">TẤT CẢ</span>
                                        <small class="text-muted ms-1">(Mọi khách hàng)</small>
                                    </label>
                                </div>

                                <!-- 2. Danh sách các hạng thành viên cụ thể (Tự động khóa khi chọn Tất cả) -->
                                <div id="specificTiersWrap" class="d-flex flex-wrap gap-4 align-items-center">
                                    <div class="form-check" th:each="tier : ${allTiers}">
                                        <input class="form-check-input tier-checkbox" type="checkbox"
                                               th:field="*{membershipTierIds}"
                                               th:value="${tier.membershipTierId}"
                                               th:id="'tier_' + ${tier.membershipTierId}">
                                        <label class="form-check-label fw-medium" th:for="'tier_' + ${tier.membershipTierId}">
                                            <span class="badge" 
                                                  th:classappend="${tier.name == 'PLATINUM' ? 'bg-danger' : (tier.name == 'VIP' ? 'bg-warning text-dark' : 'bg-primary')}"
                                                  th:text="${tier.name}">NORMAL</span>
                                            <small class="text-muted ms-1" th:text="'(Chi tiêu từ ' + ${#numbers.formatDecimal(tier.minSpending, 0, 'POINT', 0, 'COMMA')} + ' đ)'"></small>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <small class="text-muted">Chọn "Tất cả" hoặc bỏ chọn để giới hạn cho từng hạng cụ thể.</small>
                        </div>

                        <div class="col-12 mt-4 d-flex justify-content-end gap-2">
                            <a th:href="@{/vouchers}" class="btn btn-outline-secondary">Hủy</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i> <span th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo Voucher'}">Lưu</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>
    function previewVoucherImage(input) {
        const container = document.getElementById('imagePreviewContainer');
        const preview = document.getElementById('imagePreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                container.style.display = 'block';
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

        // Xử lý logic chọn "Tất cả" hạng thành viên
    (function () {
        const tierAllCheckbox = document.getElementById('tier_all');
        const specificTiersWrap = document.getElementById('specificTiersWrap');
        if (!tierAllCheckbox || !specificTiersWrap) return;

        const tierCheckboxes = specificTiersWrap.querySelectorAll('.tier-checkbox');

        function updateTierState(isAll) {
            if (isAll) {
                // Tích chọn toàn bộ 3 hạng và khóa lại không cho bấm lẻ
                tierCheckboxes.forEach(cb => cb.checked = true);
                specificTiersWrap.style.pointerEvents = 'none';
                specificTiersWrap.style.opacity = '0.5';
            } else {
                // Mở khóa cho phép người dùng tự do chọn lẻ từng hạng
                specificTiersWrap.style.pointerEvents = 'auto';
                specificTiersWrap.style.opacity = '1';
            }
        }

                // 1. Khi người dùng click chọn/bỏ chọn ô "Tất cả"
        tierAllCheckbox.addEventListener('change', function () {
            if (this.checked) {
                // Bật "Tất cả": Tích cả 3 ô và khóa lại
                tierCheckboxes.forEach(cb => cb.checked = true);
                specificTiersWrap.style.pointerEvents = 'none';
                specificTiersWrap.style.opacity = '0.5';
            } else {
                // Tắt "Tất cả": BỎ TÍCH TOÀN BỘ cả 3 ô và mở khóa để bạn thoải mái chọn lẻ
                tierCheckboxes.forEach(cb => cb.checked = false);
                specificTiersWrap.style.pointerEvents = 'auto';
                specificTiersWrap.style.opacity = '1';
            }
        });

        // 2. Khi người dùng click chọn lẻ từng hạng
        tierCheckboxes.forEach(cb => {
            cb.addEventListener('change', function () {
                const total = tierCheckboxes.length;
                const checkedCount = specificTiersWrap.querySelectorAll('.tier-checkbox:checked').length;

                // Nếu bạn tự tay tích đủ cả 3 hạng -> Tự động bật lại "Tất cả" và khóa lại
                if (checkedCount === total) {
                    tierAllCheckbox.checked = true;
                    specificTiersWrap.style.pointerEvents = 'none';
                    specificTiersWrap.style.opacity = '0.5';
                } else {
                    tierAllCheckbox.checked = false;
                }
            });
        });

        // 3. Khởi tạo trạng thái ban đầu khi mở trang (Tạo mới hoặc Sửa)
        const total = tierCheckboxes.length;
        const checkedCount = specificTiersWrap.querySelectorAll('.tier-checkbox:checked').length;
        
        // Mặc định tạo mới (hoặc voucher đang áp dụng đủ 3 hạng) -> Bật "Tất cả" và khóa lại
        if (checkedCount === total || checkedCount === 0) {
            tierAllCheckbox.checked = true;
            updateTierState(true);
        } else {
            tierAllCheckbox.checked = false;
            updateTierState(false);
        }
    })();
</script>
</body>
</html>
