<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Mã khuyến mãi (Vouchers) | CINEONE ADMIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<div class="d-flex">
    <div th:replace="~{fragments/sidebar :: sidebar(${activeMenu})}"></div>

    <div class="main-content flex-grow-1 p-4" style="margin-left: 260px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold mb-1">Quản lý Mã khuyến mãi (Voucher)</h3>
                <p class="text-muted mb-0">Thiết lập chương trình giảm giá vé và đối soát lượt sử dụng</p>
            </div>
            <a th:href="@{/vouchers/create}" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i> Tạo Voucher mới
            </a>
        </div>

        <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${successMessage}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <form th:action="@{/vouchers}" method="get" class="row g-3">
                    <div class="col-md-9">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                                   placeholder="Tìm theo Mã voucher (Code)...">
                        </div>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1"><i class="bi bi-filter"></i> Lọc</button>
                        <a th:href="@{/vouchers}" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise"></i></a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th class="ps-3">Mã Voucher</th>
                                <th>Mô tả</th>
                                <th>Mức giảm</th>
                                <th>Đơn tối thiểu</th>
                                <th>Giới hạn dùng</th>
                                <th>Thời hạn áp dụng</th>
                                <th>Trạng thái</th>
                                <th class="text-end pe-3">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${vouchersPage.empty}">
                                <td colspan="8" class="text-center py-4 text-muted">Chưa có mã khuyến mãi nào.</td>
                            </tr>
                            <tr th:each="v : ${vouchersPage.content}">
                                <td class="ps-3 fw-bold text-primary font-monospace" th:text="${v.code}">CINE50</td>
                                <td th:text="${v.description != null ? v.description : 'Không có mô tả'}">Giảm giá</td>
                                <td>
                                    <span th:if="${v.discountType == 'PERCENT'}" class="badge bg-warning text-dark"
                                          th:text="${v.discountValue} + '%'"></span>
                                    <span th:if="${v.discountType != 'PERCENT'}" class="fw-bold text-success"
                                          th:text="${#numbers.formatDecimal(v.discountValue, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                                </td>
                                <td>
                                    <span th:if="${v.minOrder != null}"
                                          th:text="${#numbers.formatDecimal(v.minOrder, 0, 'POINT', 0, 'COMMA')} + ' đ'"></span>
                                </td>
                                <td>
                                    <span class="text-muted" th:text="${v.usageLimit != null ? v.usageLimit : 'Không giới hạn'}">100</span>
                                </td>
                                <td>
                                    <small class="text-muted"
                                           th:text="${(v.startAt != null ? #temporals.format(v.startAt, 'dd/MM/yy HH:mm') : 'Từ đầu') + ' - ' + (v.endAt != null ? #temporals.format(v.endAt, 'dd/MM/yy HH:mm') : 'Vô hạn')}"></small>
                                </td>
                                <td>
                                    <span th:class="'badge ' + (${v.status == 'ACTIVE'} ? 'bg-success' : 'bg-secondary')"
                                          th:text="${v.status == 'ACTIVE' ? 'Hoạt động' : 'Tạm tắt'}">ACTIVE</span>
                                </td>
                                <td class="text-end pe-3">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{'/vouchers/edit/' + ${v.voucherId}}" class="btn btn-sm btn-outline-primary">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{'/vouchers/' + ${v.voucherId} + '/toggle'}" method="post">
                                            <button type="submit" class="btn btn-sm btn-outline-warning" title="Bật/Tắt trạng thái">
                                                <i class="bi bi-power"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3" th:if="${vouchersPage.totalPages > 1}">
                <div class="text-muted small">
                    Trang <span th:text="${vouchersPage.number + 1}"></span> / <span th:text="${vouchersPage.totalPages}"></span>
                </div>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${vouchersPage.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/vouchers(page=${vouchersPage.number - 1}, keyword=${keyword})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, vouchersPage.totalPages - 1)}"
                        th:classappend="${i == vouchersPage.number} ? 'active'">
                        <a class="page-link" th:href="@{/vouchers(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${vouchersPage.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/vouchers(page=${vouchersPage.number + 1}, keyword=${keyword})}">Sau</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
