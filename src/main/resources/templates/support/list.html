<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::#support-list-content}, 'support', 'Yêu cầu hỗ trợ')}">
<body>
<div id="support-list-content">
    <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <h3 class="m-0 fw-bold">YÊU CẦU HỖ TRỢ &amp; KHIẾU NẠI</h3>
    </div>

    <!-- Thông báo -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <!-- Bộ lọc -->
    <div class="card border-0 shadow-sm p-3 mb-4">
        <form th:action="@{/support}" method="get" class="row g-3 align-items-end" id="support-filter">
            <div class="col-md-3">
                <label for="filter-keyword" class="form-label">Tìm kiếm</label>
                <input id="filter-keyword" type="text" name="keyword" class="form-control"
                       placeholder="Email hoặc nội dung..." th:value="${keyword}">
            </div>
            <div class="col-md-2">
                <label for="filter-status" class="form-label">Trạng thái</label>
                <select id="filter-status" name="status" class="form-select">
                    <option value="">Tất cả trạng thái</option>
                    <option value="PENDING" th:selected="${status == 'PENDING'}">Chờ xử lý</option>
                    <option value="IN_PROGRESS" th:selected="${status == 'IN_PROGRESS'}">Đang xử lý</option>
                    <option value="RESOLVED" th:selected="${status == 'RESOLVED'}">Đã giải quyết</option>
                    <option value="REJECTED" th:selected="${status == 'REJECTED'}">Từ chối</option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="filter-type" class="form-label">Loại yêu cầu</label>
                <select id="filter-type" name="type" class="form-select">
                    <option value="">Tất cả loại</option>
                    <option th:each="t : ${typeList}" th:value="${t}" th:text="${t}" th:selected="${t == type}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label for="filter-category" class="form-label">Danh mục</label>
                <select id="filter-category" name="category" class="form-select">
                    <option value="">Tất cả danh mục</option>
                    <option th:each="c : ${categoryList}" th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
                </select>
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Lọc</button>
                <a class="btn btn-outline-secondary" th:href="@{/support}">Đặt lại</a>
            </div>
        </form>
    </div>

    <!-- Bảng danh sách -->
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th style="width: 80px;">Mã</th>
                    <th style="width: 220px;">Khách hàng</th>
                    <th style="width: 140px;">Loại / Vấn đề</th>
                    <th>Nội dung yêu cầu</th>
                    <th style="width: 130px;">Trạng thái</th>
                    <th style="width: 160px;">Thời gian gửi</th>
                    <th class="text-end pe-3" style="width: 110px;">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${requests.content}">
                    <td class="fw-semibold text-muted" th:text="|#SR-${item.requestId}|"></td>
                    <td>
                        <div class="fw-bold" th:text="${item.user != null ? item.user.fullName : '—'}"></div>
                        <small class="text-muted" th:text="${item.user != null ? item.user.email : '—'}"></small>
                    </td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${item.type}"></span>
                        <span class="badge text-bg-light border mt-1" th:text="${item.category}"></span>
                    </td>
                    <td class="text-muted" th:text="${#strings.abbreviate(item.content, 80)}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${item.status == 'PENDING' ? 'text-bg-warning' : (item.status == 'IN_PROGRESS' ? 'text-bg-info' : (item.status == 'RESOLVED' ? 'text-bg-success' : 'text-bg-danger'))}"
                              th:text="${item.status == 'PENDING' ? 'Chờ xử lý' : (item.status == 'IN_PROGRESS' ? 'Đang xử lý' : (item.status == 'RESOLVED' ? 'Đã giải quyết' : 'Từ chối'))}"></span>
                    </td>
                    <td th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                    <td class="text-end pe-3">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/support/{id}(id=${item.requestId})}">
                            <i class="bi bi-chat-dots me-1"></i>Xử lý
                        </a>
                    </td>
                </tr>
                <tr th:if="${requests.empty}">
                    <td colspan="7" class="text-center text-muted py-5">
                        <i class="bi bi-inbox fs-2 d-block mb-2"></i>Không có yêu cầu hỗ trợ hoặc khiếu nại nào phù hợp.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Phân trang -->
        <div class="d-flex justify-content-between align-items-center p-3 flex-wrap gap-2 border-top">
            <small class="text-muted" th:text="|Tổng ${requests.totalElements} yêu cầu|">Tổng 0 yêu cầu</small>
            <nav aria-label="Phân trang" th:if="${requests.totalPages > 1}">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${requests.first ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/support(keyword=${keyword},status=${status},type=${type},category=${category},page=${requests.number - 1})}">Trước</a>
                    </li>
                    <li class="page-item disabled">
                        <span class="page-link" th:text="|${requests.number + 1} / ${requests.totalPages}|"></span>
                    </li>
                    <li class="page-item" th:classappend="${requests.last ? 'disabled' : ''}">
                        <a class="page-link"
                           th:href="@{/support(keyword=${keyword},status=${status},type=${type},category=${category},page=${requests.number + 1})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
