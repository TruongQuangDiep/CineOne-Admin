<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: main-layout(~{::#support-detail-content}, 'support', 'Chi tiết yêu cầu hỗ trợ')}">
<body>
<div id="support-detail-content">
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mx-auto" style="max-width: 800px;" role="alert">
        <i class="bi bi-check-circle me-1"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mx-auto" style="max-width: 800px;" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i><span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Đóng"></button>
    </div>

    <div class="card border shadow-sm p-4 mx-auto" style="max-width: 800px;">
        <div class="mb-4">
            <a th:href="@{/support}" class="text-decoration-none text-dark d-inline-flex align-items-center gap-2 fs-5 fw-bold">
                <i class="bi bi-arrow-left"></i>
                <span th:text="|HT${supportRequest.requestId} – ${supportRequest.user != null ? supportRequest.user.fullName : 'Người dùng'}|"></span>
                <span class="visually-hidden">CHI TIẾT YÊU CẦU</span>
            </a>
        </div>

        <h6 class="fw-bold mb-3">Thông tin yêu cầu</h6>
        <div class="ps-3 mb-3">
            <div class="mb-1">Mã yêu cầu: <span class="fw-semibold" th:text="|HT${supportRequest.requestId}|"></span></div>
            <div class="mb-1">Người gửi: <span class="fw-semibold" th:text="${supportRequest.user != null ? supportRequest.user.fullName : '—'}"></span></div>
            <div class="mb-1">Loại: <span th:text="${supportRequest.type == 'COMPLAINT' or supportRequest.type == 'KHIẾU NẠI' ? 'Khiếu nại' : 'Hỗ trợ'}"></span></div>
            <div class="mb-1">Vấn đề: <span th:text="${supportRequest.category == 'PAYMENT' or supportRequest.category == 'THANH TOÁN' ? 'Thanh toán' : (supportRequest.category == 'TICKET' or supportRequest.category == 'VÉ' ? 'Vé' : (supportRequest.category == 'BOOKING' ? 'Đặt vé' : (supportRequest.category == 'REVIEW' or supportRequest.category == 'ĐÁNH GIÁ' ? 'Đánh giá' : (supportRequest.category == 'ACCOUNT' or supportRequest.category == 'TÀI KHOẢN' ? 'Tài khoản' : 'Khác'))))}"></span></div>
            <div class="mb-1">Ngày gửi: <span th:text="${supportRequest.createdAt != null ? #temporals.format(supportRequest.createdAt, 'dd/MM/yyyy') : '—'}"></span></div>
            <div class="mb-1">Trạng thái: <span th:text="${supportRequest.status == 'PENDING' ? 'Chờ xử lý' : (supportRequest.status == 'PROCESSING' or supportRequest.status == 'IN_PROGRESS' ? 'Đang xử lý' : (supportRequest.status == 'RESOLVED' ? 'Đã giải quyết' : 'Đã đóng'))}"></span></div>
        </div>

        <div class="mb-3">
            <div class="mb-2">Nội dung yêu cầu</div>
            <div class="p-3 border rounded bg-light text-break" style="white-space: pre-wrap; min-height: 80px;" th:text="${supportRequest.content}"></div>
        </div>

        <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
            <div>
                Đơn đặt vé liên quan:
                <span class="fw-semibold"
                      th:text="${supportRequest.booking != null ? (supportRequest.booking.bookingCode != null ? supportRequest.booking.bookingCode : 'BK' + supportRequest.booking.bookingId) : 'Không có'}"></span>
            </div>
            <a th:if="${supportRequest.booking != null}"
               th:href="@{/bookings/{id}(id=${supportRequest.booking.bookingId})}"
               class="btn btn-outline-dark btn-sm px-4">Xem đơn đặt vé</a>
        </div>

        <hr class="my-4">

        <h6 class="fw-bold mb-3">Phản hồi của Admin</h6>
        <form th:action="@{/support/{id}/respond(id=${supportRequest.requestId})}" method="post">
            <div class="mb-3">
                <textarea id="support-response" name="response" rows="5" class="form-control"
                          placeholder="Nhập phản hồi cho người dùng..."
                          required th:text="${supportRequest.response}"></textarea>
            </div>

            <div class="d-flex align-items-center gap-3 mb-4">
                <label for="support-status" class="mb-0">Trạng thái</label>
                <select id="support-status" name="status" class="form-select" style="max-width: 220px;" required>
                    <option value="PENDING" th:selected="${supportRequest.status == 'PENDING'}">Chờ xử lý</option>
                    <option value="PROCESSING" th:selected="${supportRequest.status == 'PROCESSING' or supportRequest.status == 'IN_PROGRESS'}">Đang xử lý</option>
                    <option value="RESOLVED" th:selected="${supportRequest.status == 'RESOLVED'}">Đã giải quyết</option>
                    <option value="CLOSED" th:selected="${supportRequest.status == 'CLOSED' or supportRequest.status == 'REJECTED'}">Đã đóng</option>
                </select>
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-outline-dark px-5">
                    Lưu phản hồi &amp; trạng thái
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
